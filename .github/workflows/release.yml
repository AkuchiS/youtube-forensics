name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build and publish GitHub prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Test and build
        run: |
          python -m pip install '.[test]'
          python -m pytest -q
          python -m ruff check .
          python -m build
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Create immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag --prerelease --generate-notes
          --title "YouTube Forensics $GITHUB_REF_NAME"
