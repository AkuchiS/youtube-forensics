name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable GitHub prerelease tag to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  stage:
    name: verify immutable GitHub release assets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download exact immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*-*) ;;
            *) echo "Refusing non-prerelease tag: $TAG" >&2; exit 2 ;;
          esac
          metadata="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isImmutable,isPrerelease)"
          jq -e --arg tag "$TAG" \
            '.tagName == $tag and .isDraft == false and .isImmutable == true and .isPrerelease == true' \
            <<<"$metadata"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          tag_sha="$(jq -r .object.sha <<<"$tag_object")"
          if [ "$(jq -r .object.type <<<"$tag_object")" = tag ]; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .object.sha)"
          fi
          ancestry="$(gh api "repos/$GITHUB_REPOSITORY/compare/$TAG...main" --jq .status)"
          case "$ancestry" in
            ahead|identical) ;;
            *) echo "Release tag is not an ancestor of main: $ancestry" >&2; exit 2 ;;
          esac
          gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --commit "$tag_sha" \
            --json conclusion,headSha --limit 20 \
            | jq -e --arg sha "$tag_sha" \
              'any(.[]; .headSha == $sha and .conclusion == "success")'
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import email
          import glob
          import os
          import tarfile
          import zipfile

          tag = os.environ["TAG"].removeprefix("v")
          expected = tag.replace("-alpha.", "a").replace("-beta.", "b").replace("-rc.", "rc")
          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("Expected exactly one wheel and one source distribution")
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              wheel_metadata = email.message_from_bytes(archive.read(metadata_name))
          with tarfile.open(sdists[0], "r:gz") as archive:
              pkg_info = next(member for member in archive.getmembers() if member.name.endswith("/PKG-INFO"))
              source_metadata = email.message_from_binary_file(archive.extractfile(pkg_info))
          versions = {wheel_metadata["Version"], source_metadata["Version"]}
          if versions != {expected}:
              raise SystemExit(f"Distribution versions {versions!r} do not match tag {expected!r}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish with PyPI Trusted Publishing
    needs: stage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/youtube-forensics
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
