<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Forensics</title>
  <desc id="desc">Turn permitted videos into verifiable reconstruction evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58e4c2"/>
      <stop offset="1" stop-color="#69a8ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="190" fill="#2c8cff" opacity=".12" filter="url(#glow)"/>
  <circle cx="1130" cy="560" r="240" fill="#36d9ad" opacity=".10" filter="url(#glow)"/>
  <g transform="translate(88 88)">
    <rect width="92" height="92" rx="22" fill="#0c1b2a" stroke="#58e4c2" stroke-width="3"/>
    <path d="M28 25v42l38-21z" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M17 77h58" stroke="#69a8ff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="88" y="260" fill="#f7fbff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="72" font-weight="800" letter-spacing="2">YOUTUBE FORENSICS</text>
  <rect x="88" y="292" width="930" height="7" rx="4" fill="url(#accent)"/>
  <text x="88" y="370" fill="#c9d8e8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="36" font-weight="500">Turn permitted videos into verifiable</text>
  <text x="88" y="418" fill="#c9d8e8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="36" font-weight="500">reconstruction evidence.</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="21" font-weight="600">
    <rect x="88" y="490" width="222" height="54" rx="27" fill="#132c3d" stroke="#58e4c2"/>
    <text x="119" y="525" fill="#8cf4d9">HASH-BOUND</text>
    <rect x="330" y="490" width="226" height="54" rx="27" fill="#132c3d" stroke="#69a8ff"/>
    <text x="361" y="525" fill="#9bc4ff">EVERY FRAME</text>
    <rect x="576" y="490" width="260" height="54" rx="27" fill="#132c3d" stroke="#a996ff"/>
    <text x="607" y="525" fill="#c1b5ff">FAIL-CLOSED</text>
  </g>
  <text x="1192" y="580" text-anchor="end" fill="#7890a8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20">AkuchiS · MIT</text>
</svg>
